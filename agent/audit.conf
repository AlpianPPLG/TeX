# TeX Security Compliance Auditor - Configuration File
# Version: 1.0
# Date: 07 June 2026

# Output directory for raw audit data
OUTPUT_DIR=../data

# Module toggles (yes/no)
ENABLE_SSH=yes
ENABLE_FIREWALL=yes
ENABLE_PAM=yes
ENABLE_SUDOERS=yes
ENABLE_FILESYSTEM=yes
ENABLE_KERNEL=yes
ENABLE_USERS=yes
ENABLE_SERVICES=yes

# Severity threshold: only report findings at or above this level
# Values: CRITICAL, HIGH, MEDIUM, LOW
MIN_SEVERITY=LOW

# Auditor information (used in reports)
AUDITOR_NAME=System Administrator
AUDITOR_EMAIL=admin@company.com

# Enable HMAC integrity signing (yes/no)
ENABLE_HMAC_SIGNING=yes

# LaTeX template location
LATEX_TEMPLATE=./engine/templates/report_template.tex

# Maximum audit runtime in seconds
AUDIT_TIMEOUT=120

# PDF compilation timeout in seconds
PDF_TIMEOUT=30

# Warning: Do NOT run this tool as root
# Most Level 1 CIS checks read world-readable config files.
# Running as root violates least-privilege principles.
